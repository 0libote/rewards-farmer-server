name: Python Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard assets
        run: bun run build

      - name: Verify served assets resolve
        run: |
          test -s web/static/app.css
          test -s web/static/vendor/lucide-0.544.0.min.js
          grep -q 'href="/static/app.css"' web/index.html

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Pinned versions (only-binary to avoid setup-script execution).
          pip install --only-binary :all: \
            "fastapi==0.141.1" \
            "httpx==0.28.1" \
            "pydantic==2.13.5" \
            "apscheduler==3.11.3" \
            "websockets==15.0.1" \
            "python-multipart==0.0.20" \
            "pytest==9.1.1"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Compile check
        run: python -m compileall -q server/
