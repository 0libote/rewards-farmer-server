name: Python Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned versions (only-binary to avoid setup-script execution).
          pip install --only-binary :all: \
            "fastapi==0.141.1" \
            "httpx==0.28.1" \
            "pydantic==2.13.5" \
            "apscheduler==3.11.3" \
            "pytest==9.1.1"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Compile check
        run: python -m compileall -q server/
