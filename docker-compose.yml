services:
  rewards-farmer-server:
    build: .
    image: ghcr.io/0libote/rewards-farmer-server:latest
    container_name: rewards-farmer-server
    restart: unless-stopped
    # Reap the short-lived Edge helper processes so they don't pile up as
    # zombies (the container has no init of its own).
    init: true
    # Chromium requires adequate shared memory to prevent crashing on heavy web pages
    shm_size: 2gb
    ports:
      - "8345:8345" # Web Dashboard (also proxies interactive login at /vnc)
      # Optional direct noVNC access. The dashboard now proxies the interactive
      # login through /vnc, so this mapping can be removed or bound to
      # localhost ("127.0.0.1:6345:6345") to avoid exposing it.
      - "6345:6345" # Interactive Browser Login (noVNC, direct)
    volumes:
      # All account profiles, settings, logs, and state persist here
      - ./data:/app/data
    environment:
      - DATA_PATH=/app/data
      - UPSTREAM_PATH=/app/upstream
      - PORT=8345
      - VNC_PORT=6345
      - PYTHONUNBUFFERED=1
      # Set DASHBOARD_TOKEN in your shell/.env to require a token for the
      # dashboard, API and interactive login. Empty means no authentication.
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8345/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
