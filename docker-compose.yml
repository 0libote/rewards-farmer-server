services:
  rewards-farmer-server:
    build: .
    image: ghcr.io/0libote/rewards-farmer-server:latest
    container_name: rewards-farmer-server
    restart: unless-stopped
    # Chromium requires adequate shared memory to prevent crashing on heavy web pages
    shm_size: 2gb
    ports:
      - "8345:8345" # Web Dashboard
      # NOTE: the interactive login stream (noVNC) has no password. On remote
      # servers prefer binding to localhost ("127.0.0.1:6345:6345") and reaching
      # it via an SSH tunnel or authenticated reverse proxy.
      - "6345:6345" # Interactive Browser Login (noVNC)
    volumes:
      # All account profiles, settings, logs, and state persist here
      - ./data:/app/data
    environment:
      - DATA_PATH=/app/data
      - UPSTREAM_PATH=/app/upstream
      - PORT=8345
      - VNC_PORT=6345
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8345/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
